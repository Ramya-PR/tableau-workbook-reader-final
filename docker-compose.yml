# Start everything with:  docker compose up --build   then open http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Tableau Server/Cloud and other settings. Optional: the file may be absent.
    env_file:
      - path: backend/.env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
